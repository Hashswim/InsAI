name: AI service checks

on:
  pull_request:
    paths:
      - 'back/ai-service/**'
      - '.github/workflows/ai-service.yml'
  push:
    paths:
      - 'back/ai-service/**'
      - '.github/workflows/ai-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: back/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: back/ai-service/pyproject.toml
      - run: python -m pip install -e '.[test,dev]'
      - run: make check smoke PYTHON=python
      - run: make build PYTHON=python
      - name: Build runtime image and check installed package
        if: matrix.python == '3.11'
        run: |
          docker build -t insai-ai-service:ci .
          docker run --rm --network none --workdir /tmp \
            --mount type=bind,source="$PWD/scripts/smoke.py",target=/tmp/smoke.py,readonly \
            --entrypoint python insai-ai-service:ci /tmp/smoke.py
