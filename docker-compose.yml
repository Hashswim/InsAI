services:
  postgres:
    image: postgres:16-alpine
    container_name: insai-postgres
    environment:
      POSTGRES_DB: insai
      POSTGRES_USER: insai
      POSTGRES_PASSWORD: insai
    ports:
      - "5432:5432"
    volumes:
      - insai-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: insai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  insai-pg:
