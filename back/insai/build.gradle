plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.insuranceai'
version = '0.0.1-SNAPSHOT'
description = 'InsuranceAI backend - AI 중립 청구 협업 플랫폼'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Web / REST ---
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// --- AI (Spring AI ChatClient + OpenAI) — 기본 비활성, insai.ai.enabled=true + 키 주입 시 활성 ---
	implementation 'org.springframework.ai:spring-ai-openai:1.1.8'
	implementation 'org.springframework.ai:spring-ai-client-chat:1.1.8'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- Persistence ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// --- Security (임시 permitAll, 이후 게이트웨이 JWT 검증 연동) ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// RS256 JWT 발급/검증 + JWKS (Nimbus JOSE)
	implementation 'org.springframework.security:spring-security-oauth2-jose'

	// --- Ops ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Lombok ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- Dev ---
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// TODO: Testcontainers(postgresql) — Docker Desktop 호환 문제 해소 후 재도입.
	//   testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	//   testImplementation 'org.testcontainers:junit-jupiter'
	//   testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'cross-service' }
}

// Explicit opt-in: launches no external model; the Python harness owns the local stub server.
tasks.register('crossServiceTest', Test) {
	description = 'Real Spring HTTP -> FastAPI stub -> H2 cycle, via scripts.cross_service'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'cross-service' }
	outputs.upToDateWhen { false }
}
