spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:insai}
    username: ${DB_USER:insai}
    password: ${DB_PASSWORD:insai}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.insuranceai: debug
    org.hibernate.SQL: debug
    org.springframework.web: debug
