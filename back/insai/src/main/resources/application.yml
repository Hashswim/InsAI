spring:
  application:
    name: insai
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

# AI(LLM) — 기본 비활성. 키 받으면 INSAI_AI_ENABLED=true + INSAI_AI_API_KEY 로 활성화.
insai:
  ai:
    enabled: ${INSAI_AI_ENABLED:false}
    api-key: ${INSAI_AI_API_KEY:}
    model: ${INSAI_AI_MODEL:claude-opus-5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
