[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insai-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "langchain-google-genai>=4,<5", "langsmith>=0.4,<1", "pypdf>=6,<7"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["chains/prompts/*.txt"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
