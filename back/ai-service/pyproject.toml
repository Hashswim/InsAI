[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insai-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "langchain-core>=1,<2", "langchain-google-genai>=4.4.2,<5", "google-genai>=2.31,<3",
  "langsmith>=0.4,<1", "pypdf>=6,<7",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2", "langchain-openai>=1.7,<2", "psycopg[binary]>=3.2,<4", "mcp>=2.3,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["ruff>=0.12,<1", "mypy>=1.15,<3", "build>=1.2,<2"]
synthetic = ["Pillow>=11,<13", "reportlab>=4,<5"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["jev/prompts/*.txt", "rag/data/*.txt"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Automatic tracing must be disabled before importing any integration.
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["PIL.*", "reportlab.*"]
ignore_missing_imports = true
